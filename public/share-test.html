<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
        #fpsDisplay { position: fixed; top: 10px; left: 10px; }
    </style>
<style>
        #fpsDisplay {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="fpsDisplay">FPS: <span id="fpsValue">0</span>/30</div>

    <script>
        // 初始化变量
        const targetFPS = 30;
        const frameInterval = 1000 / targetFPS;
        let lastTime = performance.now();
        let frames = 0;
        let currentFPS = 0;
        let then = performance.now();
        let rafId;
        
        // 获取DOM元素
        const fpsElement = document.getElementById('fpsValue');
        
        // FPS计算函数
        function updateFPS(now) {
            frames++;
            if (now >= lastTime + 1000) {
                currentFPS = Math.round((frames * 1000) / (now - lastTime));
                fpsElement.textContent = currentFPS;
                frames = 0;
                lastTime = now;
            }
        }
        
        // 主循环
        function animate(timestamp) {
            rafId = requestAnimationFrame(animate);
            const elapsed = timestamp - then;
            
            if (elapsed > frameInterval) {
                then = timestamp - (elapsed % frameInterval);
                updateFPS(timestamp);
            }
        }
        
        // 启动动画
        animate(performance.now());
        
        // 页面不可见时暂停动画
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                cancelAnimationFrame(rafId);
            } else {
                then = performance.now();
                rafId = requestAnimationFrame(animate);
            }
        });
    </script>    
  </head>
